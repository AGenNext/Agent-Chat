{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agennext-chat.fullname" . }}
  labels:
    {{- include "agennext-chat.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agennext-chat.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- with .Values.networkPolicy.ingressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- else }}
        - podSelector: {}        # same namespace only, by default
        {{- end }}
      ports:
        - port: http
          protocol: TCP
  egress:
    # DNS resolution is always needed.
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
